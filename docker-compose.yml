# A throwaway Redmine 7 to try the plugin in. Not the real tracker.
# Start: ruby bin/demo up, then open http://127.0.0.1:3021 (loads the demo data; sign in as alex or sam with password1234, or admin / admin).
# The repository is mounted as the plugin, so a code change shows after "ruby bin/demo restart".
# Wipe it: ruby bin/demo reset
# Tests: ruby bin/test (runs the "test" service below)
services:
  redmine:
    image: redmine:7.0.2
    container_name: redmine-rubylode-agenda-dev
    ports:
      - "127.0.0.1:3021:3000"
    environment:
      # The image ships without the development gems, so production is the mode it can boot in.
      RAILS_ENV: production
    volumes:
      - .:/usr/src/redmine/plugins/redmine_rubylode_agenda
      - redmine-rubylode-agenda-files:/usr/src/redmine/files
      - redmine-rubylode-agenda-sqlite:/usr/src/redmine/sqlite

  test:
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    profiles: ["test"]
    environment:
      RAILS_ENV: test
    volumes:
      - .:/usr/src/redmine/plugins/redmine_rubylode_agenda

volumes:
  redmine-rubylode-agenda-files:
  redmine-rubylode-agenda-sqlite:
